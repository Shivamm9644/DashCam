<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Inurum Live Stream Player with Audio</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: monospace;
      font-size: 11px;
      font-weight: 700;
      color: #10b981;
      background: rgba(0, 0, 0, 0.75);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(16, 185, 129, 0.4);
      z-index: 10;
      pointer-events: none;
    }

    .status-badge.buffering {
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.4);
    }

    /* Prominent Audio Toggle Button */
    .audio-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      color: #f1f5f9;
      border: 1px solid rgba(0, 212, 255, 0.5);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .audio-btn:hover {
      background: rgba(0, 212, 255, 0.25);
      border-color: #00d4ff;
      transform: scale(1.04);
    }

    .audio-btn.muted {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.6);
      color: #fca5a5;
    }

    .audio-btn.unmuted {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.6);
      color: #6ee7b7;
    }

    /* Unmute Banner Overlay for Browser Autoplay Policy */
    .unmute-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #00d4ff;
      box-shadow: 0 8px 32px rgba(0, 212, 255, 0.25);
      padding: 12px 20px;
      border-radius: 12px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      z-index: 15;
      transition: transform 0.2s;
    }

    .unmute-banner:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }

    .overlay-hud {
      position: absolute;
      bottom: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 10px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 10px;
      border-radius: 4px;
      pointer-events: auto;
      z-index: 10;
    }

    .volume-slider {
      width: 70px;
      height: 4px;
      accent-color: #00d4ff;
      cursor: pointer;
    }

    .waiting-box {
      position: absolute;
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 5;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(0, 212, 255, 0.2);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Muted initially to satisfy strict browser autoplay policy -->
  <video id="liveVideo" autoplay playsinline muted></video>

  <div id="statusBadge" class="status-badge">● CONNECTING TO 4G STREAM...</div>

  <!-- Audio Toggle Button -->
  <button id="audioToggleBtn" class="audio-btn muted" onclick="toggleAudio()">
    <span id="audioIcon">🔇</span>
    <span id="audioLabel">AUDIO MUTED (CLICK TO PLAY SOUND)</span>
  </button>

  <!-- Big Unmute Overlay prompt -->
  <div id="unmuteBanner" class="unmute-banner" onclick="enableAudio()">
    <span>🔊</span>
    <span>Tap / Click to Enable Live Dashcam Audio</span>
  </div>

  <div id="waitingBox" class="waiting-box">
    <div class="spinner"></div>
    <div id="waitingMsg">Connecting to Live Video & Audio Stream (505073583696)...</div>
  </div>

  <div class="overlay-hud">
    <span id="chLabel">CH1: FRONT ROAD LENS</span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span id="audioStatusText" style="color: #00d4ff;">MIC: READY</span>
      <input type="range" id="volSlider" class="volume-slider" min="0" max="1" step="0.05" value="1"
        oninput="setVolume(this.value)">
      <span id="fpsLabel">25 FPS • 1080P FHD</span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const terminalId = params.get('terminalId') || '';
    const ch = params.get('ch') || '1';
    const video = document.getElementById('liveVideo');
    const status = document.getElementById('statusBadge');
    const waiting = document.getElementById('waitingBox');
    const chLabel = document.getElementById('chLabel');
    const audioBtn = document.getElementById('audioToggleBtn');
    const audioIcon = document.getElementById('audioIcon');
    const audioLabel = document.getElementById('audioLabel');
    const unmuteBanner = document.getElementById('unmuteBanner');
    const audioStatusText = document.getElementById('audioStatusText');
    const volSlider = document.getElementById('volSlider');

    chLabel.innerText = ch === '1' ? 'CH1: FRONT ROAD LENS' : 'CH2: REAR / CABIN LENS';

    // Same-origin: server.js proxies /media/live to the gateway (works on HTTPS, no mixed content)
    const streamUrl = `/media/live/${terminalId}_${ch}/live.m3u8`;
    let authToken = null;
    try { authToken = localStorage.getItem('inurum_auth_token'); } catch (_) { }
    const authHeaders = authToken ? { 'Authorization': `Bearer ${authToken}` } : {};

    // Audio functions
    function enableAudio() {
      video.muted = false;
      video.volume = parseFloat(volSlider.value) || 1.0;
      video.play().catch(() => { });
      updateAudioUi(true);
      unmuteBanner.style.display = 'none';
    }

    function toggleAudio() {
      if (video.muted) {
        enableAudio();
      } else {
        video.muted = true;
        updateAudioUi(false);
      }
    }

    function setVolume(val) {
      video.volume = parseFloat(val);
      if (video.volume > 0 && video.muted) {
        enableAudio();
      } else if (video.volume === 0) {
        video.muted = true;
        updateAudioUi(false);
      }
    }

    function updateAudioUi(isUnmuted) {
      if (isUnmuted && !video.muted) {
        audioBtn.className = 'audio-btn unmuted';
        audioIcon.innerText = '🔊';
        audioLabel.innerText = `AUDIO ON (${Math.round(video.volume * 100)}%)`;
        audioStatusText.innerText = 'MIC: LIVE AUDIO';
        audioStatusText.style.color = '#10b981';
      } else {
        audioBtn.className = 'audio-btn muted';
        audioIcon.innerText = '🔇';
        audioLabel.innerText = 'AUDIO MUTED (CLICK TO UNMUTE)';
        audioStatusText.innerText = 'MIC: MUTED';
        audioStatusText.style.color = '#f59e0b';
      }
    }

    // Listen for Flutter App postMessage events
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      if (event.data === 'TOGGLE_AUDIO' || event.data.action === 'TOGGLE_AUDIO') {
        toggleAudio();
      } else if (event.data.action === 'SET_AUDIO') {
        if (event.data.muted) {
          video.muted = true;
          updateAudioUi(false);
        } else {
          enableAudio();
        }
      }
    });

    // Live session on the backend (it sends 0x9101 to the camera, checks quota, enforces the time limit)
    const jsonHeaders = { ...authHeaders, 'Content-Type': 'application/json' };
    let liveDispatched = false;
    let liveEnded = false;
    function dispatchLiveStart() {
      if (liveEnded) return Promise.resolve();
      return fetch('/api/v1/live-sessions', { method: 'POST', headers: jsonHeaders, body: JSON.stringify({ terminalId, channelId: parseInt(ch, 10) }) })
        .then(async r => {
          if (r.ok) { liveDispatched = true; return; }
          const err = await r.json().catch(() => ({}));
          const waitingMsg = document.getElementById('waitingMsg');
          if (waitingMsg && r.status !== 409) waitingMsg.innerHTML = `⚠️ <b>${err.message || 'Live stream could not start'}</b>`;
        })
        .catch(() => { });
    }
    dispatchLiveStart();

    // Without heartbeats the backend stops the camera stream after 30s (saves SIM data)
    setInterval(async () => {
      if (!liveDispatched || liveEnded) return;
      try {
        const r = await fetch('/api/v1/live-sessions/heartbeat', { method: 'POST', headers: jsonHeaders, body: JSON.stringify({ terminalId }) });
        const hb = await r.json();
        if (hb && hb.active === false) {
          liveEnded = true;
          status.innerText = '● ENDED';
          const waitingMsg = document.getElementById('waitingMsg');
          if (waitingMsg) waitingMsg.innerHTML = `⏹️ <b>Live time limit reached</b><br><span style="font-size:11px;color:#cbd5e1;">Reload the page to watch again.</span>`;
        }
      } catch (_) { }
    }, 8000);
    // Inside the dashboard the parent page owns start/stop; a standalone player stops the stream itself
    window.addEventListener('pagehide', () => {
      if (window.top === window && liveDispatched && !liveEnded) {
        fetch('/api/v1/live-sessions/stop', { method: 'POST', headers: jsonHeaders, body: JSON.stringify({ terminalId }), keepalive: true }).catch(() => { });
      }
    });

    // Real JT808 socket status (from gateway /api/devices via backend) for honest live diagnostics
    let wasOnline = null;
    async function checkDeviceStatus() {
      const waitingMsg = document.getElementById('waitingMsg');
      try {
        const res = await fetch(`/api/v1/live/device-status?terminalId=${encodeURIComponent(terminalId)}`, { headers: authHeaders });
        if (!res.ok) {
          if (waitingMsg && (res.status === 401 || res.status === 404)) {
            waitingMsg.innerHTML = res.status === 401
              ? `⚠️ <b>Session expired</b><br><span style="font-size:11px;color:#cbd5e1;">Please log in again.</span>`
              : `⚠️ <b>Device ${terminalId} is not registered for your account</b>`;
          }
          return;
        }
        const dev = await res.json();
        if (dev.online === false) {
          status.innerText = `● CAM OFFLINE`;
          status.className = 'status-badge buffering';
          if (waitingMsg) {
            const last = dev.lastOnline ? new Date(dev.lastOnline).toLocaleString() : 'never';
            waitingMsg.innerHTML = `⚠️ <b>Dashcam is not connected to the server</b><br><span style="font-size:11px;color:#cbd5e1;line-height:1.6;display:inline-block;margin-top:6px;">Last online: ${last}<br>Camera settings: Server IP <b>${dev.gatewayHost}</b>, Port <b>${dev.jt808Port}</b>, Protocol JT808.<br>Check SIM mobile data, then close the phone app live preview.</span>`;
          }
        } else if (dev.online === true) {
          // Camera just came online: (re)send the 0x9101 live start
          if (wasOnline === false || !liveDispatched) dispatchLiveStart();
          if (waitingMsg) {
            waitingMsg.innerHTML = `📡 <b>Dashcam connected</b><br><span style="font-size:11px;color:#10b981;line-height:1.6;display:inline-block;margin-top:6px;">Live request sent. Waiting for video from the camera...</span>`;
          }
        }
        wasOnline = dev.online;
      } catch (_) { }
    }
    checkDeviceStatus();
    setInterval(checkDeviceStatus, 5000);

    let hlsInstance = null;

    function initHls() {
      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          // Camera uplink is 4G with ~5.6s segments: stay 3 segments behind the edge so jitter doesn't stall playback
          lowLatencyMode: false,
          liveSyncDurationCount: 3,
          liveMaxLatencyDurationCount: 6,
          maxBufferLength: 30,
          fragLoadingTimeOut: 20000,
          fragLoadingMaxRetry: 6,
          manifestLoadingMaxRetry: 20,
          manifestLoadingRetryDelay: 2000,
        });

        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => { });
          waiting.style.display = 'none';
          status.innerText = `● LIVE CH${ch}`;
          status.className = 'status-badge';

          if (hlsInstance.audioTracks && hlsInstance.audioTracks.length > 0) {
            audioStatusText.innerText = `MIC: ${hlsInstance.audioTracks[0].name || 'AAC LIVE'}`;
          }
        });

        hlsInstance.on(Hls.Events.AUDIO_TRACK_LOADED, () => {
          audioStatusText.innerText = 'MIC: DASHCAM AUDIO STREAM';
          audioStatusText.style.color = '#10b981';
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            status.innerText = `● AWAITING STREAM CH${ch}...`;
            status.className = 'status-badge buffering';
            setTimeout(() => {
              try { hlsInstance.loadSource(streamUrl); } catch (e) { }
            }, 3000);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play().catch(() => { });
        video.onloadedmetadata = () => {
          waiting.style.display = 'none';
          status.innerText = `● LIVE CH${ch}`;
        };
      }
    }

    initHls();
  </script>
</body>

</html>
