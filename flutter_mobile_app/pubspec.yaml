name: inurum_dashcam_app
description: "TrackAnywhere Fleet & DashCam Telematics"
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.3
  shared_preferences: ^2.3.3
  http: ^1.2.2
  intl: ^0.19.0
  video_player: ^2.14.1
  google_fonts: ^8.2.1
  google_maps_flutter: 2.10.0
  google_maps_flutter_android: 2.14.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/icons/
    - assets/map_styles/
    - assets/videos/
